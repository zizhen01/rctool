[package]
name = "rctool-core"
description = "Xiaomi RC003 语音遥控器桥接核心：ATVV 协议、ADPCM 解码、BLE 会话与音频输出"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
bluest = "0.6"
cpal = "0.15"
futures-lite = "2"
hound = "3.5"
log = "0.4"
ringbuf = "0.4"
tokio = { version = "1", features = ["time", "macros", "sync", "rt"] }
tokio-util = "0.7"
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
# 前台应用检测（NSWorkspace）。版本与 tauri 依赖树一致，不引入额外编译单元。
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
] }

[dev-dependencies]
env_logger = "0.11"
