name: Release

# 推 v* 标签自动打三平台安装包并创建 GitHub Release（草稿）；
# 也可在 Actions 页手动触发（只上传构建产物，不发 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # AppImage 打包在无 FUSE 的 CI 环境下需要此开关
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 前端是纯静态文件，无需 node 构建；tauri-cli 通过 npx 临时获取
      - name: Build Tauri bundles
        working-directory: apps/tray
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Build CLI (release)
        run: cargo build --release -p rctool-cli

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
               -o -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} dist/ \;
          if [ -d target/release/bundle/macos ]; then
            (cd target/release/bundle/macos && for a in *.app; do
               zip -qr "$GITHUB_WORKSPACE/dist/${a%.app}-macos-app.zip" "$a"; done)
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/rctool.exe dist/rctool-cli-windows.exe
          else
            cp target/release/rctool "dist/rctool-cli-$(echo ${{ runner.os }} | tr 'A-Z' 'a-z')"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: rctool-${{ matrix.os }}
          path: dist/*

      # 打 tag 时汇总为 Release 草稿，人工确认后发布。
      # 注意：当前产物未签名——macOS 需右键打开或 xattr -dr com.apple.quarantine，
      # Windows 会有 SmartScreen 提示；正式分发需接入 Developer ID / 代码签名。
      - name: Publish GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
