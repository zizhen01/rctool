<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RCTool: turn a Xiaomi voice remote into a desktop microphone">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171a"/>
      <stop offset="1" stop-color="#232327"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="0.28" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.3" stop-color="#e4e4e7"/>
      <stop offset="1" stop-color="#cbcbcf"/>
    </linearGradient>
    <radialGradient id="pKey" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#4a4a4e"/>
      <stop offset="1" stop-color="#333337"/>
    </radialGradient>
    <radialGradient id="pOk" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#616166"/>
      <stop offset="1" stop-color="#4b4b50"/>
    </radialGradient>
    <radialGradient id="pPad" cx="0.5" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#4e4e52"/>
      <stop offset="1" stop-color="#37373b"/>
    </radialGradient>
    <filter id="pShadow" x="-40%" y="-25%" width="180%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      text { font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .rc-body { fill: url(#pBody); stroke: #9a9a9e; stroke-width: 1; }
      .rc-glint { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 1; }
      .rc-ring { fill: rgba(0,0,0,0.015); stroke: #55555a; stroke-opacity: 0.45; stroke-width: 1.3; }
      .rc-ring-mic { fill: rgba(10,132,255,0.06); stroke: #0a84ff; stroke-opacity: 0.85; stroke-width: 1.3; }
      .rc-ico { fill: none; stroke: #55555a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .rc-icof { fill: #55555a; }
      .rc-pad { fill: url(#pPad); }
      .rc-dot { fill: #8a8a8e; }
      .rc-cap { fill: url(#pKey); }
      .rc-ok { fill: url(#pOk); }
      .rc-icw { fill: none; stroke: #ededf0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .rc-seam { stroke: rgba(0,0,0,0.22); stroke-width: 1; }
      .rc-tv { fill: #ededf0; font-size: 6.8px; font-weight: 700; text-anchor: middle; }
      .rc-nfc-s { fill: none; stroke: #98989c; stroke-width: 1.1; opacity: 0.6; }
      .rc-nfc-t { fill: #98989c; font-size: 8.5px; font-weight: 600; font-style: italic; text-anchor: middle; opacity: 0.75; }
      .rc-brand { fill: #a6a6aa; font-size: 10.5px; font-weight: 500; letter-spacing: 1.6px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="460" fill="url(#pBg)"/>
  <rect width="1200" height="460" fill="url(#pGlow)"/>

  <!-- RC003 遥控器（与应用内 SVG 同源，1:3.97 真机比例） -->
  <g transform="translate(150,26) rotate(-8) scale(0.64)" filter="url(#pShadow)">
    <rect class="rc-body" x="25" y="12" width="150" height="596" rx="44"/>
    <rect class="rc-glint" x="26.5" y="13.5" width="147" height="593" rx="42.8"/>

    <circle class="rc-ring" cx="61.5" cy="55" r="19"/>
    <path class="rc-ico" d="M55.5,52 A8.5,8.5 0 1 0 67.5,52"/>
    <line class="rc-ico" x1="61.5" y1="44" x2="61.5" y2="54"/>
    <circle class="rc-ring-mic" cx="138.5" cy="55" r="19"/>
    <rect class="rc-icof" x="135" y="45" width="7" height="12" rx="3.5"/>
    <path class="rc-ico" d="M131,54 A7.5,7.5 0 0 0 146,54"/>
    <line class="rc-ico" x1="138.5" y1="61.5" x2="138.5" y2="65.5"/>
    <line class="rc-ico" x1="134" y1="65.5" x2="143" y2="65.5"/>

    <circle class="rc-pad" cx="100" cy="146" r="63"/>
    <circle class="rc-dot" cx="100" cy="94" r="1.7"/>
    <circle class="rc-dot" cx="100" cy="198" r="1.7"/>
    <circle class="rc-dot" cx="48" cy="146" r="1.7"/>
    <circle class="rc-dot" cx="152" cy="146" r="1.7"/>
    <circle class="rc-ok" cx="100" cy="146" r="37.5"/>

    <circle class="rc-cap" cx="67.5" cy="243" r="21.5"/>
    <polyline class="rc-icw" points="71,235.5 63.5,243 71,250.5"/>
    <path class="rc-cap" d="M111,270.75 L111,243 A21.5,21.5 0 0 1 154,243 L154,270.75 Z"/>
    <line class="rc-icw" x1="124.5" y1="243" x2="140.5" y2="243"/>
    <line class="rc-icw" x1="132.5" y1="235" x2="132.5" y2="251"/>
    <path class="rc-cap" d="M111,270.75 L111,298.5 A21.5,21.5 0 0 0 154,298.5 L154,270.75 Z"/>
    <line class="rc-icw" x1="124.5" y1="298.5" x2="140.5" y2="298.5"/>
    <line class="rc-seam" x1="115" y1="270.75" x2="150" y2="270.75"/>
    <circle class="rc-cap" cx="67.5" cy="298.5" r="21.5"/>
    <path class="rc-icw" d="M58.5,299.5 L67.5,290.5 L76.5,299.5 M61,297 L61,307.5 L74,307.5 L74,297"/>
    <circle class="rc-cap" cx="67.5" cy="355" r="21.5"/>
    <line class="rc-icw" x1="60.5" y1="349" x2="74.5" y2="349"/>
    <line class="rc-icw" x1="60.5" y1="355" x2="74.5" y2="355"/>
    <line class="rc-icw" x1="60.5" y1="361" x2="74.5" y2="361"/>
    <circle class="rc-cap" cx="132.5" cy="355" r="21.5"/>
    <rect class="rc-icw" x="123.5" y="348.5" width="18" height="13" rx="3"/>
    <text class="rc-tv" x="132.5" y="357.6">TV</text>

    <g>
      <rect class="rc-nfc-s" x="92" y="450" width="16" height="15" rx="3.5"/>
      <text class="rc-nfc-t" x="100" y="461.2">N</text>
    </g>
    <text class="rc-brand" x="100" y="557">xiaomi</text>
  </g>

  <!-- 标题与说明 -->
  <text x="424" y="150" font-size="76" font-weight="700" fill="#f5f5f7">RCTool</text>
  <rect x="428" y="172" width="112" height="6" rx="3" fill="#0a84ff"/>
  <text x="426" y="234" font-size="28" font-weight="500" fill="#d6d6da">Turn your Xiaomi voice remote into a desktop mic</text>
  <text x="426" y="284" font-size="17" fill="#8e8e93">Hold to talk&#160;&#160;→&#160;&#160;BLE / ATVV decoding&#160;&#160;→&#160;&#160;16 kHz PCM&#160;&#160;→&#160;&#160;virtual mic&#160;&#160;→&#160;&#160;system dictation</text>
  <text x="426" y="330" font-size="17" fill="#a6a6aa">Rust + Tauri&#160;&#160;·&#160;&#160;macOS / Windows / Linux&#160;&#160;·&#160;&#160;voice bridge + 13-key remapping</text>
  <text x="1164" y="432" font-size="14" fill="#6a6a6e" text-anchor="end">github.com/zizhen01/rctool</text>
</svg>
