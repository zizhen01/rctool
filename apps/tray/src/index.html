<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RCTool 设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="statusbar" id="statusbar" data-kind="stopped" data-tauri-drag-region>
      <span class="dot"></span>
      <span id="status-text">已停止</span>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="connection">连接</button>
      <button class="tab" data-tab="keys">按键</button>
      <button class="tab" data-tab="apps">应用</button>
      <button class="tab" data-tab="permissions">权限</button>
    </nav>

    <main>
      <!-- 连接 -->
      <section class="page active" id="page-connection">
        <div class="card">
          <div class="row">
            <div class="label">
              <div class="title">语音输出设备</div>
              <div class="hint">选择回环设备（BlackHole 等），其输入侧即成为虚拟麦克风</div>
            </div>
          </div>
          <select id="output-select"></select>
          <div class="warn" id="no-loopback" hidden>
            <span id="no-loopback-text"></span>
            <div class="warn-actions">
              <button class="ghost sm" id="setup-loopback"></button>
              <button class="ghost sm" id="recheck-outputs">重新检测</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <div class="label">
              <div class="title">增益</div>
              <div class="hint">放大或减弱语音音量（<span id="gain-value">0.0</span> dB）</div>
            </div>
          </div>
          <input type="range" id="gain" min="-24" max="24" step="0.5" value="0" />
        </div>

        <div class="card" id="card-fn-remap">
          <label class="switch-row">
            <div class="label">
              <div class="title">按住麦克风键即听写</div>
              <div class="hint">把遥控器麦克风键映射为 🌐（需在系统听写里选“按住 🌐”）</div>
            </div>
            <input type="checkbox" id="fn-remap" />
          </label>
        </div>

        <div class="card" id="card-win-hotkey" hidden>
          <label class="switch-row">
            <div class="label">
              <div class="title">语音时自动打开 Windows 语音输入</div>
              <div class="hint">语音流开始/结束时合成 Win+H 切换系统语音输入面板</div>
            </div>
            <input type="checkbox" id="win-hotkey" />
          </label>
        </div>

        <button class="primary" id="toggle-bridge">启用桥接</button>
      </section>

      <!-- 按键 -->
      <section class="page" id="page-keys">
        <div class="card">
          <label class="switch-row">
            <div class="label">
              <div class="title">启用按键映射</div>
              <div class="hint">拦截 TV / 电源等键的原生行为并救活返回键（需权限）</div>
            </div>
            <input type="checkbox" id="key-mapping" />
          </label>
        </div>
        <div class="keys-layout">
          <div class="keys-left">
            <div class="seg" id="remote-style" role="tablist" aria-label="遥控器样式">
              <button class="seg-btn active" data-style="rc003">RC003</button>
              <button class="seg-btn" data-style="atv">Apple TV</button>
            </div>

            <div class="remote-wrap" id="wrap-rc003">
          <svg viewBox="0 0 200 620" class="remote" id="remote-svg" aria-label="RC003 遥控器">
            <defs>
              <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" class="bg-a" />
                <stop offset="0.3" class="bg-b" />
                <stop offset="1" class="bg-c" />
              </linearGradient>
              <radialGradient id="keyGrad" cx="0.5" cy="0.35" r="0.8">
                <stop offset="0" class="kg-a" />
                <stop offset="1" class="kg-b" />
              </radialGradient>
              <radialGradient id="okGrad" cx="0.5" cy="0.4" r="0.75">
                <stop offset="0" class="og-a" />
                <stop offset="1" class="og-b" />
              </radialGradient>
              <radialGradient id="padGrad" cx="0.5" cy="0.38" r="0.8">
                <stop offset="0" class="pg-a" />
                <stop offset="1" class="pg-b" />
              </radialGradient>
            </defs>

            <!-- 银色金属机身（1:3.97，照片实测比例）-->
            <rect class="body" x="25" y="12" width="150" height="596" rx="44" />
            <rect class="body-glint" x="26.5" y="13.5" width="147" height="593" rx="42.8" />

            <!-- 顶部：电源 / 语音（细描边圆环键）-->
            <g class="key" data-button="power" tabindex="0" role="button" aria-label="电源">
              <circle class="ring" cx="61.5" cy="55" r="19" />
              <path class="ico" d="M55.5,52 A8.5,8.5 0 1 0 67.5,52" />
              <line class="ico" x1="61.5" y1="44" x2="61.5" y2="54" />
            </g>
            <g class="key mic" data-button="mic" tabindex="0" role="button" aria-label="语音">
              <circle class="ring" cx="138.5" cy="55" r="19" />
              <rect class="ico-fill" x="135" y="45" width="7" height="12" rx="3.5" />
              <path class="ico" d="M131,54 A7.5,7.5 0 0 0 146,54" />
              <line class="ico" x1="138.5" y1="61.5" x2="138.5" y2="65.5" />
              <line class="ico" x1="134" y1="65.5" x2="143" y2="65.5" />
            </g>

            <!-- 大圆盘 touchpad（占机身宽 84%）：四向扇区 + 极点圆点 + 中心 OK -->
            <circle class="dpad-base" cx="100" cy="146" r="63" />
            <g class="key" data-button="up" tabindex="0" role="button" aria-label="上">
              <path class="sector" d="M57.57,103.57 A60,60 0 0 1 142.43,103.57 L126.52,119.48 A37.5,37.5 0 0 0 73.48,119.48 Z" />
            </g>
            <g class="key" data-button="right" tabindex="0" role="button" aria-label="右">
              <path class="sector" d="M142.43,103.57 A60,60 0 0 1 142.43,188.43 L126.52,172.52 A37.5,37.5 0 0 0 126.52,119.48 Z" />
            </g>
            <g class="key" data-button="down" tabindex="0" role="button" aria-label="下">
              <path class="sector" d="M142.43,188.43 A60,60 0 0 1 57.57,188.43 L73.48,172.52 A37.5,37.5 0 0 0 126.52,172.52 Z" />
            </g>
            <g class="key" data-button="left" tabindex="0" role="button" aria-label="左">
              <path class="sector" d="M57.57,188.43 A60,60 0 0 1 57.57,103.57 L73.48,119.48 A37.5,37.5 0 0 0 73.48,172.52 Z" />
            </g>
            <circle class="pad-dot" cx="100" cy="94" r="1.7" />
            <circle class="pad-dot" cx="100" cy="198" r="1.7" />
            <circle class="pad-dot" cx="48" cy="146" r="1.7" />
            <circle class="pad-dot" cx="152" cy="146" r="1.7" />
            <g class="key" data-button="ok" tabindex="0" role="button" aria-label="确定">
              <circle class="okcap" cx="100" cy="146" r="37.5" />
            </g>

            <!-- 左列 返回/主页/菜单（圆键），右列 音量胶囊摇杆 + TV -->
            <g class="key" data-button="back" tabindex="0" role="button" aria-label="返回">
              <circle class="cap" cx="67.5" cy="243" r="21.5" />
              <polyline class="ico-w" points="71,235.5 63.5,243 71,250.5" />
            </g>
            <g class="key" data-button="volume_up" tabindex="0" role="button" aria-label="音量加">
              <path class="cap" d="M111,270.75 L111,243 A21.5,21.5 0 0 1 154,243 L154,270.75 Z" />
              <line class="ico-w" x1="124.5" y1="243" x2="140.5" y2="243" />
              <line class="ico-w" x1="132.5" y1="235" x2="132.5" y2="251" />
            </g>
            <g class="key" data-button="volume_down" tabindex="0" role="button" aria-label="音量减">
              <path class="cap" d="M111,270.75 L111,298.5 A21.5,21.5 0 0 0 154,298.5 L154,270.75 Z" />
              <line class="ico-w" x1="124.5" y1="298.5" x2="140.5" y2="298.5" />
            </g>
            <line class="vol-seam" x1="115" y1="270.75" x2="150" y2="270.75" />
            <g class="key" data-button="home" tabindex="0" role="button" aria-label="主页">
              <circle class="cap" cx="67.5" cy="298.5" r="21.5" />
              <path class="ico-w" d="M58.5,299.5 L67.5,290.5 L76.5,299.5 M61,297 L61,307.5 L74,307.5 L74,297" />
            </g>
            <g class="key" data-button="menu" tabindex="0" role="button" aria-label="菜单">
              <circle class="cap" cx="67.5" cy="355" r="21.5" />
              <line class="ico-w" x1="60.5" y1="349" x2="74.5" y2="349" />
              <line class="ico-w" x1="60.5" y1="355" x2="74.5" y2="355" />
              <line class="ico-w" x1="60.5" y1="361" x2="74.5" y2="361" />
            </g>
            <g class="key" data-button="tv" tabindex="0" role="button" aria-label="TV">
              <circle class="cap" cx="132.5" cy="355" r="21.5" />
              <rect class="ico-w" x="123.5" y="348.5" width="18" height="13" rx="3" />
              <text class="tv-label" x="132.5" y="357.6">TV</text>
            </g>

            <!-- NFC 触碰区标记与品牌字 -->
            <g class="nfc">
              <rect x="92" y="450" width="16" height="15" rx="3.5" />
              <text x="100" y="461.2">N</text>
            </g>
            <text class="brand" x="100" y="557">xiaomi</text>
          </svg>
        </div>

        <div class="remote-wrap" id="wrap-atv" hidden>
          <svg viewBox="0 0 200 600" class="remote atv" aria-label="Apple TV 款遥控器">
            <defs>
              <radialGradient id="akGrad" cx="0.5" cy="0.35" r="0.8">
                <stop offset="0" class="ak-a" />
                <stop offset="1" class="ak-b" />
              </radialGradient>
              <radialGradient id="apGrad" cx="0.5" cy="0.38" r="0.8">
                <stop offset="0" class="ap-a" />
                <stop offset="1" class="ap-b" />
              </radialGradient>
              <radialGradient id="aokGrad" cx="0.5" cy="0.4" r="0.75">
                <stop offset="0" class="aok-a" />
                <stop offset="1" class="aok-b" />
              </radialGradient>
            </defs>

            <!-- 银色机身（1:3.84，方角更小）-->
            <rect class="body" x="25" y="12" width="150" height="576" rx="20" />
            <rect class="body-glint" x="26.5" y="13.5" width="147" height="573" rx="18.8" />
            <rect class="mic-hole" x="96.8" y="38.4" width="6.4" height="2.4" rx="1.2" />

            <!-- 顶部：MENU / 电源（小黑圆键，白字白图标）-->
            <g class="key" data-button="menu" tabindex="0" role="button" aria-label="菜单">
              <circle class="cap" cx="55.3" cy="41.6" r="12.7" />
              <text class="menu-label" x="55.3" y="43.5">MENU</text>
            </g>
            <g class="key" data-button="power" tabindex="0" role="button" aria-label="电源">
              <circle class="cap" cx="144.7" cy="41.6" r="12.7" />
              <path class="ico-w thin" d="M141.2,39.9 A5,5 0 1 0 148.2,39.9" />
              <line class="ico-w thin" x1="144.7" y1="35.2" x2="144.7" y2="41.2" />
            </g>

            <!-- Clickpad：近黑大圆盘 + 内圈缝线 + 四个白点 + 中心确认 -->
            <circle class="dpad-base" cx="100" cy="119.1" r="59" />
            <g class="key" data-button="up" tabindex="0" role="button" aria-label="上">
              <path class="sector" d="M60.4,79.5 A56,56 0 0 1 139.6,79.5 L125.1,94 A35.5,35.5 0 0 0 74.9,94 Z" />
            </g>
            <g class="key" data-button="right" tabindex="0" role="button" aria-label="右">
              <path class="sector" d="M139.6,79.5 A56,56 0 0 1 139.6,158.7 L125.1,144.2 A35.5,35.5 0 0 0 125.1,94 Z" />
            </g>
            <g class="key" data-button="down" tabindex="0" role="button" aria-label="下">
              <path class="sector" d="M139.6,158.7 A56,56 0 0 1 60.4,158.7 L74.9,144.2 A35.5,35.5 0 0 0 125.1,144.2 Z" />
            </g>
            <g class="key" data-button="left" tabindex="0" role="button" aria-label="左">
              <path class="sector" d="M60.4,158.7 A56,56 0 0 1 60.4,79.5 L74.9,94 A35.5,35.5 0 0 0 74.9,144.2 Z" />
            </g>
            <circle class="pad-dot" cx="100" cy="66.1" r="1.8" />
            <circle class="pad-dot" cx="100" cy="172.1" r="1.8" />
            <circle class="pad-dot" cx="47" cy="119.1" r="1.8" />
            <circle class="pad-dot" cx="153" cy="119.1" r="1.8" />
            <g class="key" data-button="ok" tabindex="0" role="button" aria-label="确定">
              <circle class="okcap" cx="100" cy="119.1" r="35" />
            </g>
            <circle class="pad-seam" cx="100" cy="119.1" r="35.5" />

            <!-- 第一排：返回 / TV -->
            <g class="key" data-button="back" tabindex="0" role="button" aria-label="返回">
              <circle class="cap" cx="65.8" cy="215.9" r="24" />
              <polyline class="ico-w" points="69.3,207.7 61.7,215.9 69.3,224.1" />
            </g>
            <g class="key" data-button="tv" tabindex="0" role="button" aria-label="TV">
              <circle class="cap" cx="134.5" cy="215.9" r="24" />
              <rect class="ico-w" x="125.5" y="208.9" width="18" height="12.5" rx="2.2" />
              <line class="ico-w" x1="130" y1="224.6" x2="139" y2="224.6" />
            </g>

            <!-- 第二/三排：播放暂停、静音（RC003 无对应键），右侧音量胶囊 -->
            <g class="key" data-button="play_pause" tabindex="0" role="button" aria-label="播放暂停">
              <circle class="cap" cx="65.8" cy="270" r="24" />
              <polygon class="ico-w" points="59.5,264 59.5,276 68.5,270" />
              <line class="ico-w" x1="72.8" y1="264.5" x2="72.8" y2="275.5" />
              <line class="ico-w" x1="76.6" y1="264.5" x2="76.6" y2="275.5" />
            </g>
            <g class="key" data-button="mute" tabindex="0" role="button" aria-label="静音">
              <circle class="cap" cx="65.8" cy="334.6" r="24" />
              <path class="ico-w" d="M57.5,331 L61.5,331 L66.5,326 L66.5,343.2 L61.5,338.2 L57.5,338.2 Z" />
              <line class="ico-w" x1="57" y1="343.5" x2="74" y2="326.5" />
            </g>
            <g class="key" data-button="volume_up" tabindex="0" role="button" aria-label="音量加">
              <path class="cap" d="M110.5,302.3 L110.5,270 A24,24 0 0 1 158.5,270 L158.5,302.3 Z" />
              <line class="ico-w" x1="126.5" y1="270" x2="142.5" y2="270" />
              <line class="ico-w" x1="134.5" y1="262" x2="134.5" y2="278" />
            </g>
            <g class="key" data-button="volume_down" tabindex="0" role="button" aria-label="音量减">
              <path class="cap" d="M110.5,302.3 L110.5,334.6 A24,24 0 0 0 158.5,334.6 L158.5,302.3 Z" />
              <line class="ico-w" x1="126.5" y1="334.6" x2="142.5" y2="334.6" />
            </g>
            <line class="vol-seam" x1="115" y1="302.3" x2="154" y2="302.3" />
          </svg>
            </div>
          </div>

          <div class="keys-right">
            <div class="card map-table">
              <table>
                <tbody id="map-rows"></tbody>
              </table>
            </div>
            <div class="hint" id="key-note">点击遥控器按键或表格行查看说明</div>
            <button class="ghost" id="reset-bindings">恢复默认映射</button>
          </div>
        </div>
      </section>


      <!-- 应用（按前台应用覆盖按键，只展示与全局的差异）-->
      <section class="page" id="page-apps">
        <div class="card">
          <div class="row">
            <div class="label">
              <div class="title">按应用覆盖</div>
              <div class="hint">前台应用切换时自动套用。这里只列出与「按键」页全局映射<b>不同</b>的项，其余键沿用全局。</div>
            </div>
          </div>
          <div class="app-add">
            <select id="app-picker"></select>
            <input type="text" id="app-bundle" placeholder="或手动填 bundle id" spellcheck="false" />
            <button class="ghost sm" id="add-app">添加</button>
          </div>
          <div class="warn" id="apps-need-mapping" hidden>「按键」页的按键映射未启用，这里的覆盖暂时不会生效。</div>
          <div class="warn subtle" id="front-app-hint" hidden>
            <span id="front-app-text"></span>
            <div class="warn-actions">
              <button class="ghost sm" id="add-front-app">添加它</button>
            </div>
          </div>
        </div>

        <div class="apps-layout">
          <div class="app-list" id="app-list"></div>
          <div class="app-detail" id="app-detail"></div>
        </div>
      </section>

      <!-- 权限 -->
      <section class="page" id="page-permissions">
        <div class="card" id="perm-note">
          <div class="hint">按键映射需要以下 macOS 权限。语音桥接本身只需蓝牙权限。</div>
        </div>
        <div class="card perm" id="perm-input">
          <div class="label">
            <div class="title">输入监控</div>
            <div class="hint">读取遥控器按键所需</div>
          </div>
          <div class="perm-action">
            <span class="badge" id="badge-input">检查中</span>
            <button class="ghost sm" id="req-input">请求</button>
          </div>
        </div>
        <div class="card perm" id="perm-ax">
          <div class="label">
            <div class="title">辅助功能</div>
            <div class="hint">注入按键与拦截原生事件所需</div>
          </div>
          <div class="perm-action">
            <span class="badge" id="badge-ax">检查中</span>
            <button class="ghost sm" id="req-ax">打开设置</button>
          </div>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
